name: Update neofetch README

on:
  push:
    branches: [main]        # roda a cada push na main (inclusive quando voce edita a arte)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  schedule:
    - cron: "0 6 * * *"   # todo dia as 06:00 UTC (03:00 no horario de Brasilia)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar stats no README
        env:
          # usa o token automatico do Actions; se voce criar o secret GH_TOKEN, ele tem prioridade
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GH_USER: lealgabriel1
        run: python scripts/neofetch.py

      - name: Commitar se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos stats."
          else
            git commit -m "chore: atualiza stats do neofetch"
            git push
          fi
